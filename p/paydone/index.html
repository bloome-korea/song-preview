<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>결제 완료 · 블루메 송</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f3ec;font-family:'Noto Serif KR',serif;color:#2b2622;display:flex;min-height:100vh;align-items:center;justify-content:center}
.c{max-width:380px;padding:40px 28px;text-align:center}
h1{font-size:22px;font-weight:600;margin:0 0 16px;letter-spacing:-0.02em}
p{font-size:15px;line-height:1.75;color:#6b625a;margin:0 0 12px}
.btn{display:block;margin:22px 0 0;padding:14px 20px;border-radius:3px;background:#00704a;color:#fff;text-decoration:none;font-size:17px}
.note{font-size:13px;color:#8a7d70;margin-top:28px}
</style>
</head>
<body>
<div class="c">
  <h1>결제가 완료됐어요</h1>
  <p id="msg">고마워요. 내 노래 페이지로 돌아가 전체곡을 받아 주세요.</p>
  <a class="btn" id="go" href="https://bloomesong.com/status.html">내 노래 페이지로 가기</a>
  <p class="note" id="note">잠시 뒤 자동으로 이동해요.</p>
</div>
<script>
(function(){
  // PayApp returnurl = /p/paydone/?o=접수번호 → 다크 사이트 status.html?paid=접수번호
  // 절대 주소: 예전 bloomelove returnurl 로 들어와도 bloomesong.com 다크로 보냄.
  var o=(new URLSearchParams(location.search).get('o')||'').toUpperCase().replace(/[^A-Z0-9-]/g,'');
  var url='https://bloomesong.com/status.html'+(o?'?paid='+encodeURIComponent(o):'');
  document.getElementById('go').href=url;
  setTimeout(function(){location.replace(url)},1500);
})();
</script>
</body></html>
