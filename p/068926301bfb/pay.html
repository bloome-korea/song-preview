<div class="stage-nav">

</footer>
<script src="../../assets/p/smartstore_links.js"></script>
<script src="../../assets/p/bloome_price.js"></script>
<script>
(function(){
  const KEY='bloome_pv_sent_068926301bfb';
  const q0=new URLSearchParams(location.search);
  if(q0.get('debug')==='1'){ const nav=document.querySelector('.stage-nav'); if(nav) nav.classList.add('show'); }
  const P=BLOOME_PRICE, panel=document.getElementById('panel');
  const links=window.BLOOME_SMARTSTORE_LINKS||{};
  function render(){
    const st=P.parseAnchor(KEY);
    if(st.expired){
      panel.innerHTML=`<div class="paper expired"><h2>결제 시간이 지났어요</h2>
        <p>미리듣기를 보내드린 뒤 24시간이 지나 결제가 닫혔어요. 파일은 지우지 않았어요. 고객센터로 문의해 주세요.</p>
        <a class="btn green" href="#">고객센터에 문의하기</a></div>`;
      return;
    }
    const url=links[st.amount]||'';
    const has=!!url;
    panel.innerHTML=`<div class="paper">
      <div class="pricebox"><span class="now">지금 결제 금액 · ${st.label}</span>
      <span class="amt">${P.won(st.amount)}</span>
      ${st.leftSec!=null && !st.reopened ? `<div class="cd"><b>${P.fmt(st.leftSec)}</b> 남음</div>` : (st.reopened?`<div class="cd">${st.label}</div>`:'')}
      </div>
      <p>네이버 스마트스토어에서 결제해요. 네이버페이·카드 모두 가능해요.</p>
      ${has
        ? `<a class="btn green" id="ss" href="${url}" target="_blank" rel="noopener">네이버페이·카드로 결제하기 (스마트스토어)</a>`
        : `<button class="btn green" type="button" disabled>결제 링크 준비 중이에요</button>`}
      <p class="small" style="margin-top:14px">결제 후 주문자명/연락처로 확인해 전체곡을 보내드려요.</p>
    </div>`;
  }
  render();
  const back=document.getElementById('backPreview');
  if(back) back.href='index.html'+P.carryParams();
  // live tick for countdown on pay too
  setInterval(function(){
    const st=P.parseAnchor(KEY);
    if(st.expired || st.reopened || st.leftSec==null) return;
    const b=panel.querySelector('.cd b');
    if(b) b.textContent=P.fmt(st.leftSec);
  },1000);
})();
</script>
